server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: OMS
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-in-production}
  expiration: 86400000 # 24 hours in milliseconds

app:
  cors:
    allowed-origins: http://localhost:5173,https://ancient-cackle-6v479wpvv7pcrw99-5173.app.github.dev
