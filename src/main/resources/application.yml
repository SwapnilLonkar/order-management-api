server:
  forward-headers-strategy: framework

spring:
  application:
    name: OMS
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-in-production}
  expiration: 86400000 # 24 hours in milliseconds
